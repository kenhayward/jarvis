# Run the suite on every push and pull request.
#
# Two platforms, and they are not equals yet.
#
# macOS is the gate. JARVIS was written on a Mac, every macOS-specific
# subprocess (osascript, screencapture, sips, claude) is faked at the seam in
# tests, and a green run here means what a green run on the author's machine
# means.
#
# Windows is a progress meter, and is allowed to fail on purpose. The port is
# phased: the platform layer that gives `actions.py`, `screen.py`,
# `notifier.py` and `dialog.py` a second implementation does not exist yet, so
# a large number of these tests cannot pass and are not expected to. What this
# job buys in the meantime is a number that only ever goes down, measured on
# every commit rather than discovered at the end. When it reaches zero, delete
# the `continue-on-error` line below and Windows becomes a gate too.
#
# The suite needs: Python 3.11+ (the code uses `X | None` at runtime; 3.9,
# which macOS ships as `python3`, dies at import), Node for the frontend
# build that tests/test_dashboard_page.py drives, and Playwright's Chromium
# for the same test plus read_page / look_at_page. It does NOT need a Fish
# Audio key, a Claude login, or the network: `pytest.ini` deselects the nine
# browser-integration tests, and everything else runs offline.

name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # Windows failures do not fail the build — see the header. macOS does.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 25

    strategy:
      # Windows going red must not cancel the run that actually gates merges.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Playwright Chromium
        run: python -m playwright install chromium

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Test suite
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
        run: pytest -v -o faulthandler_timeout=300 -p no:cacheprovider
